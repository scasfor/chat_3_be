services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Password123}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "1433:1433"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # JDBC-style SQL Server URL for Prisma / @prisma/adapter-mssql.
      # trustServerCertificate=true is appropriate for local Docker; for Azure SQL
      # use encrypt=true and trustServerCertificate=false (or omit).
      DATABASE_URL: sqlserver://sqlserver:1433;database=${DB_DATABASE:-coibot};user=sa;password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};encrypt=true;trustServerCertificate=true
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHATBOT_CORS_ORIGINS: ${CHATBOT_CORS_ORIGINS:-*}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  sqlserver-data:
